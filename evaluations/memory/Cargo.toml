[package]
name = "pravah-memory-eval"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reproducible LoCoMo, LongMemEval, and pgvector recall evaluation for Pravah"
license = "MIT OR Apache-2.0"

[dependencies]
argh = "0.1"
async-trait = "0.1"
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.32"
mool = { version = "=0.2.12", default-features = false, features = ["postgres", "vector"] }
pravah-memory = { path = "../../pravah-memory", features = ["postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["json", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "pravah-memory-eval"
path = "src/bin/pravah-memory-eval.rs"
