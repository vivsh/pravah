[package]
name = "pravah-memory"
version = "0.1.1"
edition = "2024"
description = "Evidence-backed, temporal memory for Rust agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivsh/pravah"
readme = "README.md"
keywords = ["agent", "memory", "llm", "retrieval", "vector"]
categories = ["database", "science"]
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-*",
]

[features]
default = []
postgres = ["dep:mool", "dep:sha2", "dep:sqlx", "dep:tokio", "dep:tracing"]
recall-postgres = ["postgres"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
mool = { version = "0.2.12", default-features = false, features = ["postgres", "vector"], optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "=0.8.6", default-features = false, features = ["derive", "json", "postgres"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
allocation-counter = "0.8"
pgvector = { version = "0.4.2", features = ["sqlx"] }

[[bench]]
name = "memory_context"
harness = false

[[bench]]
name = "memory_recall_postgres"
harness = false
required-features = ["recall-postgres"]

[[example]]
name = "postgres"
required-features = ["postgres"]

[package.metadata.docs.rs]
all-features = true
