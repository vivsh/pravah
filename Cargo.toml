[package]
name = "pravah"
version = "0.4.5"
edition = "2024"
description = "Typed, stepwise agentic information flows for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivsh/pravah"
keywords = ["agent", "llm", "flow", "ai", "async"]
categories = ["asynchronous", "science"]

[features]
default = []
testing = []

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.13.2", features = ["json"] }
gemini-rust = { version = "1.7.1" }
tracing = "0.1"
indexmap = { version = "2.14.0", features = ["serde"] }
either = { version = "1.15.0", features = ["serde"] }
futures = "0.3.32"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
argh = "0.1"
tempfile = "3.27.0"
mockito = "1"
dotenvy = "0.15"
pravah = { path = ".", features = ["testing"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
either = "1"
