[package]
name = "pravah"
version = "0.4.8"
edition = "2024"
description = "Typed, stepwise agentic information flows for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivsh/pravah"
keywords = ["agent", "llm", "flow", "ai", "async"]
categories = ["asynchronous", "science"]
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/assets/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-*",
]

[workspace]
members = ["pravah-memory"]
default-members = [".", "pravah-memory"]
exclude = ["evaluations/memory"]
resolver = "3"

[features]
default = []
testing = []
mcp = ["dep:http", "dep:percent-encoding", "dep:rmcp"]

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time"] }
schemars = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.49.9", default-features = false }
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.13.2", features = ["json"] }
tracing = "0.1"
indexmap = { version = "2.14.0", features = ["serde"] }
either = { version = "1.15.0", features = ["serde"] }
futures = "0.3.32"
uuid = { version = "1", features = ["v7", "serde"] }
rath-rs = "0.2.4"
rmcp = { version = "3.1", optional = true, default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
http = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }

[dev-dependencies]
allocation-counter = "0.8"
argh = "0.1"
axum = "0.8"
tempfile = "3.27.0"
dotenvy = "0.15"
pravah = { path = ".", features = ["testing"] }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
either = "1"
ciborium = "0.2"
tokio = { version = "1", features = ["net"] }
tokio-util = "0.7"

[[bench]]
name = "runtime"
harness = false

[profile.dev]
incremental = false

[package.metadata.docs.rs]
all-features = true
