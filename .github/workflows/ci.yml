name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: Deterministic examples
        run: |
          cargo run --quiet -p pravah --example graph_typed_composition
          cargo run --quiet -p pravah --example graph_snapshot_resume
          cargo run --quiet -p pravah --example graph_json_invocation
          cargo run --quiet -p pravah --example graph_typed
          cargo run --quiet -p pravah --example graph_untyped
      - name: Package Pravah
        run: cargo package -p pravah
